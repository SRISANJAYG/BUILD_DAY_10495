<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Text Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>🎤 Speech-to-Text Pad</h2>
        
        <p id="status">Click "Start" and speak...</p>

        <textarea id="text-pad" placeholder="Your speech will appear here..."></textarea>

        <div class="buttons">
            <button id="start-btn" onclick="startListening()">Start Listening</button>
            <button id="stop-btn" onclick="stopListening()" disabled>Stop Listening</button>
            <button id="save-btn" onclick="saveNote()">Save Note</button>
        </div>

        <h3>Saved Notes:</h3>
        <ul id="notes-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
