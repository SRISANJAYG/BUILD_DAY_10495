<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Notes Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="app-title">🎤 Voice Notes Pro</h2>
        <p id="status">Click "Start" to begin recording...</p>

        <textarea id="text-pad" placeholder="Your speech text will appear here..."></textarea>

        <div class="buttons">
            <button id="start-btn">Start Listening</button>
            <button id="stop-btn" disabled>Stop</button>
            <button id="save-btn">Save Note</button>
        </div>

        <h3 class="notes-header">Saved History</h3>
        
        <div id="notes-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
